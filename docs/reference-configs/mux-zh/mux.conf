; A list of outputs
outputs {
    zeromq {
        endpoint "tcp://*:8950"
        allowmetadata true
    }
    throttle "simul://"
    edi {
        destinations {
            output_edi_tcp {
                protocol tcp
                listenport 8850
                max_frames_queued 500
                preroll-burst 3.5
            }

        }
        port 5000
        enable_pft false 
        fec 2
        dump false 
        verbose false 
        tagpacket_alignment 16
    }
}

