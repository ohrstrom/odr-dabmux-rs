; This configuration file was generated by ansible

; More information about the usage of the tools is available
; in the guide, which can be found on the
; www.opendigitalradio.org website.

general {
    dabmode 1
    nbframes 0
    syslog false 
    tist true 
    tist_offset 2
    tai_clock_bulletins "https://hpiers.obspm.fr/iers/bul/bulc/ntp/leap-seconds.list|https://raw.githubusercontent.com/eggert/tz/master/leap-seconds.list"
    managementport 12720
    startupcheck "chronyc waitsync 2 0.01"
}

remotecontrol {
    telnetport 12721
    zmqendpoint tcp://lo:12722
}

ensemble {
    id 0x4401
    ecc 0xE1
    local-time-offset auto
    international-table 1
    label "DIG D04 - ZH"
    shortlabel "DIG D04"
}





