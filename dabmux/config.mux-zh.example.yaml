        bitrate: 48
        input: {protocol: edi, uri: "tcp://:9012"}
        user_applications: [slideshow]

  - id: 0x4dcf
    label: "105 DJ RADIO"
    short_label: DJ RADIO
    pty: 10
    language: 0x08
    components:
      - type: dab_plus
        subchannel_id: 18
        bitrate: 72
        input: {protocol: edi, uri: "tcp://:9115"}
        user_applications: [slideshow]

  - id: 0x121b
    label: ROCK ANTENNE
    short_label: ROCK ANT
    pty: 11
    language: 0x08
    components:
      - type: dab_plus
        subchannel_id: 19
        bitrate: 48
        input: {protocol: edi, uri: "tcp://:9094"}
        user_applications: [slideshow]

  # SPI data service. Its 32-bit id is copied from mux.conf: the top byte is
  # the ECC (0x44 here, not the ensemble's 0xE1), so check it with the operator.
  - id: 0x44010001
    label: DIG_SPI
    short_label: DIG_SPI
    components:
      - type: enhanced_packet
        subchannel_id: 30
        bitrate: 8
        # Packets from an SPI encoder, addressed 1; on air: /home/odr/spi.bin.
        input: {protocol: file, path: ../docs/reference-configs/mux-zh/spi.bin}
        packet_address: 1
        user_applications: [spi]

output:
  tagpacket_alignment: 16
  destinations:
    - {protocol: tcp, listen_port: 8850, max_frames_queued: 500, preroll_ms: 3500}
