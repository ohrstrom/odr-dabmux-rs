# Adapted from the supplied ODR-DabMux production INFO configuration.
# Automatic local offset uses the host timezone; bulletin URLs require HTTPS access.
# TCP inputs throttle their encoder by default (backpressure). For live encoders
# whose clock drift should be absorbed here, add `backpressure: false` per input.

ensemble:
  id: 0x0001
  ecc: 0xe1
  label: RND D00 - XX
  short_label: RND D00
  mode: 1
  tist: true
  tist_offset_ms: 2000
  tai_clock_bulletins:
    - https://hpiers.obspm.fr/iers/bul/bulc/ntp/leap-seconds.list
    - https://raw.githubusercontent.com/eggert/tz/master/leap-seconds.list
  local_time_offset_auto: true
  international_table: 1

defaults:
  # EEP 3-A is also the built-in default.
  protection: {profile: eep_a, level: 3}

services:
  - id: 0x4001
    label: "105 DJ HRND-001"
    short_label: HRND-001
    pty: 15
    language: 0x08
    components:
      - type: dab_plus
        subchannel_id: 1
        bitrate: 72
        input: {protocol: edi, uri: "tcp://0.0.0.0:9001"}
        user_applications: [slideshow]

  - id: 0x4002
    label: TOP CC HRND-002
    short_label: HRND-002
    pty: 15
    language: 0x08
    components:
      - type: dab_plus
