ensemble:
  id: 20479
  ecc: 225
  label: Example Mux
  mode: 1
  tist: false

services:
  - uid: radio_one
    id: 19875
    label: Radio X

subchannels:
  - uid: audio_one
    id: 1
    bitrate: 72
    kind: dab_plus
    protection:
      profile: eep_a
      level: 3
    input:
      protocol: edi
      uri: tcp://127.0.0.1:9000
      # TCP inputs throttle the encoder by default (backpressure), which an
      # unpaced file encoder (odr-audioenc -i file.wav) needs. For a live
      # encoder, `backpressure: false` drops frames instead, absorbing drift.
      # backpressure: false

components:
  - uid: component_one
    service: radio_one
    subchannel: audio_one

output:
  destinations:
    - protocol: tcp
      listen_port: 9001
