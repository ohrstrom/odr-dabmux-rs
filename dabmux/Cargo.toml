[package]
name = "dabmux"
version = "0.0.1-rc.0"
edition = "2021"
description = "DAB multiplexer"

[dependencies]
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["normalize-path"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
serde_yaml = "0.9.34"
notify = "8.2.0"

[[bin]]
name = "dabmux"
path = "src/main.rs"
