[group:enc-5]
programs=audio-5,pad-5

[program:audio-5]
directory=/encoder
environment=
  SRC="http://stream.openbroadcast.ch/128.mp3",
  ENCODER_ID="5",
  AUDIOENC_ARGS="--bitrate 64 --rate 48000 --channels 2 --pad 32"
command=/usr/bin/liquidsoap ls/encoder.liq
killasgroup=true
stopsignal=KILL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pad-5]
directory=/encoder
command=odr-padenc
  --sleep 60
  --output enc-5
  --dls /encoder/run/enc-5/dls.txt
  --dir /encoder/run/enc-5/sls
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
