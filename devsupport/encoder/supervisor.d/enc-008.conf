[group:enc-8]
programs=audio-8,pad-8

[program:audio-8]
directory=/encoder
environment=
  SRC="http://maxxima.mine.nu/maxxima.mp3",
  ENCODER_ID="8",
  AUDIOENC_ARGS="--bitrate 48 --rate 48000 --channels 2 --pad 32"
command=/usr/bin/liquidsoap ls/encoder.liq
killasgroup=true
stopsignal=KILL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pad-8]
directory=/encoder
command=odr-padenc
  --sleep 60
  --output enc-8
  --dls /encoder/run/enc-8/dls.txt
  --dir /encoder/run/enc-8/sls
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
