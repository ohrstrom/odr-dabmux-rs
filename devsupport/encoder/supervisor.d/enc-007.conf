[group:enc-7]
programs=audio-7,pad-7

[program:audio-7]
directory=/encoder
environment=
  SRC="http://stream.openbroadcast.ch/128.mp3",
  ENCODER_ID="7",
  AUDIOENC_ARGS="--bitrate 48 --rate 48000 --channels 2 --pad 16 --sbr"
command=/usr/bin/liquidsoap ls/encoder.liq
killasgroup=true
stopsignal=KILL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pad-7]
directory=/encoder
command=odr-padenc
  --sleep 60
  --output enc-7
  --dls /encoder/run/enc-7/dls.txt
  --dir /encoder/run/enc-7/sls
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
