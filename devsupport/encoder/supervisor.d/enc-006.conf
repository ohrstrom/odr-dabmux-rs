[group:enc-6]
programs=audio-6,pad-6

[program:audio-6]
directory=/encoder
environment=
  SRC="http://maxxima.mine.nu/maxxima.mp3",
  ENCODER_ID="6",
  AUDIOENC_ARGS="--bitrate 56 --rate 48000 --channels 2 --pad 32"
command=/usr/bin/liquidsoap ls/encoder.liq
killasgroup=true
stopsignal=KILL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pad-6]
directory=/encoder
command=odr-padenc
  --sleep 60
  --output enc-6
  --dls /encoder/run/enc-6/dls.txt
  --dir /encoder/run/enc-6/sls
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
